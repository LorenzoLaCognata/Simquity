# Cloud Run assigns a port at random and tells the app which one via the
# PORT environment variable. Locally, PORT won't be set, so it falls back
# to 8080 - that's what the ":8080" after PORT means everywhere below.
server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-0-REGION.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:postgres.xxxxxxxx}
spring.datasource.password=${DATABASE_PASSWORD:YOUR-PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- CORS ---
# Which frontend is allowed to call this API. Locally this is Vite's
# dev server; in production it'll be your Vercel URL, passed in as
# FRONTEND_ORIGIN when deploying (see DEPLOY.md).
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
